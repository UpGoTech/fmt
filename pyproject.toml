[project]
name = "frappe-manager-traefik"
version = "0.1.0"
description = "Frappe Manager - Traefik: production Frappe/ERPNext/HRMS sites on Docker + Traefik"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["typer>=0.12", "rich>=13"]

[project.scripts]
fmt = "fmt.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["fmt"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint]
ignore = ["B008"]
